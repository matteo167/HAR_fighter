[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "har-fighter"
version = "0.1.0"
description = "Controle de personagens de Street Fighter II via visão computacional (YOLOv8-Pose + OpenCV + TensorFlow)."
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]
