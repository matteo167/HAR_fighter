# Catálogo de classes reconhecidas pelo sistema, dividido em dois eixos
# INDEPENDENTES e SIMULTÂNEOS (dois classificadores rodando em paralelo
# sobre a mesma sequência de pose — ver pipeline/realtime_pipeline.py):
#
#   movement -> deslocamento lateral (parado / esquerda / direita)
#   action   -> postura/ataque (parado / agachado / pulo / socos / chutes)
#
# Cada eixo tem sua PRÓPRIA classe "idle" (neutro daquele eixo, não do
# personagem como um todo) — por isso dá pra andar para a esquerda E socar
# ao mesmo tempo: são publicados em eventos separados
# (movement_detected / action_detected).
#
# Para adicionar uma classe nova (ex.: "defesa" no eixo action), basta
# adicionar uma entrada no eixo certo aqui — nenhum código precisa mudar.
#
# hold: true  -> tecla pressionada enquanto a classe daquele eixo for detectada
# hold: false -> tecla "tocada" (tap) a cada detecção
# game_keys: teclas emuladas para o jogo/emulador

axes:
  movement:
    - name: idle
      hold: false
      game_keys: []
      description: "Sem deslocamento lateral."

    - name: walk_left
      hold: true
      game_keys: ["left"]
      description: "Caminhar para a esquerda."

    - name: walk_right
      hold: true
      game_keys: ["right"]
      description: "Caminhar para a direita."

  action:
    - name: idle
      hold: false
      game_keys: []
      description: "Nenhuma ação (sem postura especial nem ataque)."

    - name: crouch
      hold: true
      game_keys: ["down"]
      description: "Agachado."

    - name: jump
      hold: false
      game_keys: ["up"]
      description: "Pulo."

    - name: punch_light
      hold: false
      game_keys: ["a"]
      description: "Soco fraco (jab)."

    - name: punch_medium
      hold: false
      game_keys: ["s"]
      description: "Soco médio."

    - name: punch_heavy
      hold: false
      game_keys: ["d"]
      description: "Soco forte."

    - name: kick_light
      hold: false
      game_keys: ["z"]
      description: "Chute fraco."

    - name: kick_medium
      hold: false
      game_keys: ["x"]
      description: "Chute médio."

    - name: kick_heavy
      hold: false
      game_keys: ["c"]
      description: "Chute forte."
